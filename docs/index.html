  /* Busca o texto do bloco Versículo no YouVersion (pelo servidor) */
  async function buscarVers(B, btn) {
    if (!B || B.tipo !== 'biblico') return;
    if (!String(B.ref || '').trim()) {
      toast('Escreva a referência primeiro (ex.: Mateus 24:45-47).', true);
      return;
    }
    if (String(B.texto || '').trim() && !confirm('Substituir o texto atual pelo texto do YouVersion?')) return;
    if (!String(B.versao || '').trim()) B.versao = 'NBV';
    if (btn) {
      btn.disabled = true;
      btn.lastChild.textContent = ' Buscando…';
    }
    try {
      const r = await run('buscarVersiculo', B.ref, B.versao);
      B.texto = r.texto;
      B.copyright = r.copyright || '';
      if (r.referencia) B.ref = r.referencia; // forma oficial, ex.: "Hebreus 10:24-25"
      marcar();
      render();
      toast('Texto preenchido' + (r.referencia ? ': ' + r.referencia : ''));
    } catch (e) {
      falha(e);
      if (btn && btn.isConnected) {
        btn.disabled = false;
        btn.lastChild.textContent = ' Buscar';
      }
    }
  }

  /* ======================= importar / exportar (.json) ======================= */
  /* Arquivo: { formato: 'sermoes/1', exportado: ISO, sermao: { tema, pasta, tempo, topicos } }
   * Também aceita o objeto do sermão "solto" (sem o envelope). Ver CONTEXT.md, "Arquivo .sermao.json". */
  const FORMATO = 'sermoes/1';
  const str = v => typeof v === 'string' ? v : v == null ? '' : String(v);
  const slug = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'sermao';
  function paraArquivo(m) {
    return {
      formato: FORMATO,
      exportado: new Date().toISOString(),
      sermao: {
        tema: m.tema || '',
        pasta: m.pasta || '',
        tempo: m.tempo || 30,
        opcoes: tele(m) ? {
          teleprompter: true
        } : {},
        topicos: m.topicos.map(t => {
          const p = {
            titulo: t.titulo || ''
          };
          if (t.tempo > 0) p.tempo = +t.tempo;
          p.blocos = JSON.parse(JSON.stringify(t.blocos || []));
          return p;
        })
      }
    };
  }

  /* iPad: abre a folha de compartilhamento (Salvar em Arquivos, AirDrop, e-mail…); computador: baixa o arquivo */
  async function exportar() {
    const m = S.msg,
      nome = slug(m.tema) + '.sermao.json';
    const arq = new File([JSON.stringify(paraArquivo(m), null, 2)], nome, {
      type: 'application/json'
    });
    try {
      if (navigator.canShare && navigator.canShare({
        files: [arq]
      })) {
        await navigator.share({
          files: [arq],
          title: m.tema || 'Sermão'
        });
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    const url = URL.createObjectURL(arq),
      a = document.createElement('a');
    a.href = url;
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Arquivo ' + nome + ' baixado');
  }

  /* aceita só os campos conhecidos de cada tipo; tipo desconhecido com texto vira Parágrafo, sem texto é ignorado */
  function normalizarBloco(b) {
    if (!b || !TIPOS[b.tipo] || b.tipo === 'egw') return b && typeof b.texto === 'string' ? {
      tipo: 'texto',
      texto: b.texto
    } : null;
    switch (b.tipo) {
      case 'biblico':
        {
          const x = {
            tipo: 'biblico',
            ref: str(b.ref),
            versao: str(b.versao) || 'NBV',
            texto: str(b.texto)
          };
          if (b.copyright) x.copyright = str(b.copyright);
          return x;
        }
      case 'lista':
        {
          const itens = Array.isArray(b.itens) ? b.itens.map(str) : [];
          return {
            tipo: 'lista',
            itens: itens.length ? itens : ['']
          };
        }
      case 'citacao':
        {
          const x = {
            tipo: 'citacao',
            texto: str(b.texto),
            fonte: str(b.fonte)
          };
          if (b.conferida === true) x.conferida = true;
          return x;
        }
      case 'imagem':
        return {
          tipo: 'imagem',
          url: str(b.url),
          legenda: str(b.legenda)
        };
      default:
        return {
          tipo: b.tipo,
          texto: str(b.texto)
        };
    }
  }

  /* lê e confere o arquivo; devolve { msg, avisos } ou lança um erro em português */
  function lerArquivoSermao(texto) {
    let d;
    try {
      d = JSON.parse(texto);
    } catch (e) {
      throw new Error('O arquivo não é um JSON válido.');
    }
    if (d && d.formato) {
      const v = String(d.formato).match(/^sermoes\/(\d+)$/);
      if (!v) throw new Error('Formato de arquivo desconhecido: ' + d.formato + '.');
      if (+v[1] > 1) throw new Error('Este arquivo é de uma versão mais nova do app (' + d.formato + '). Atualize o app e tente de novo.');
    }
    const s = d && d.sermao ? d.sermao : d;
    if (!s || !Array.isArray(s.topicos) || !s.topicos.length) throw new Error('O arquivo não tem as partes do sermão ("topicos").');
    const avisos = [];
    let tempo = Math.round(+s.tempo) || 30;
    if (TEMPOS.indexOf(tempo) < 0) {
      const perto = TEMPOS.reduce((a, b) => Math.abs(b - tempo) < Math.abs(a - tempo) ? b : a);
      avisos.push('Tempo de ' + tempo + ' min ajustado para ' + perto + ' min.');
      tempo = perto;
    }
    let ignorados = 0;
    const topicos = s.topicos.map((t, i) => {
      const p = {
        titulo: str(t && t.titulo) || 'Parte ' + (i + 1),
        blocos: []
      };
      if (t && +t.tempo > 0) p.tempo = Math.round(+t.tempo);
      (t && Array.isArray(t.blocos) ? t.blocos : []).forEach(b => {
        const x = normalizarBloco(b);
        if (x) p.blocos.push(x);else ignorados++;
      });
      return p;
    });
    if (ignorados) avisos.push(plural(ignorados, 'bloco de tipo desconhecido foi ignorado.', 'blocos de tipo desconhecido foram ignorados.'));
    const msg = {
      id: '',
      _local: 'local-' + Date.now(),
      tema: str(s.tema).trim() || 'Sermão importado',
      pasta: str(s.pasta).trim(),
      tempo,
      eventos: [],
      topicos,
      opcoes: s.opcoes && s.opcoes.teleprompter ? {
        teleprompter: true
      } : {}
    };
    const tam = tamanho(msg);
    if (tam > LIMITE) throw new Error('Sermão grande demais para importar (' + tam + ' de ' + LIMITE + ' caracteres). Divida em dois arquivos.');
    return {
      msg,
      avisos
    };
  }

  /* abre o sermão importado no editor; o salvamento automático cuida do resto (também sem internet) */
  async function importar(arquivo) {
    let r;
    try {
      r = lerArquivoSermao(await arquivo.text());
    } catch (e) {
      return falha(e);
    }
    const m = r.msg;
    if (S.lista.some(x => norm(x.tema) === norm(m.tema))) {
      if (!confirm('Já existe um sermão com o tema “' + m.tema + '”. Importar mesmo assim, como cópia?')) return;
      m.tema += ' (importado)';
    }
    m.topicos.forEach((t, i) => t._open = i === 0);
    S.msg = m;
    S.dirty = false;
    S.ins = null;
    S.sel = '';
    S.view = 'editor';
    render();
    window.scrollTo(0, 0);
    marcar();
    const semTexto = m.topicos.reduce((n, t) => n + t.blocos.filter(b => b.tipo === 'biblico' && !b.texto.trim()).length, 0);
    toast(['Importado: ' + plural(m.topicos.length, 'parte', 'partes') + '.'].concat(semTexto ? [plural(semTexto, 'versículo está', 'versículos estão') + ' sem texto: toque em Buscar.'] : []).concat(r.avisos).join(' '), false, null, 9000);
  }

  /* ======================= dados ======================= */
  async function carregarLista() {
    S.carregando = true;
    S.view = 'lista';
    render();
    try {
      S.lista = await run('listarMensagens');
      local.gravar(CACHE_LISTA, S.lista);
      S.offline = false;
    } catch (e) {
      if (e.rede) {
        S.lista = local.ler(CACHE_LISTA) || [];
        S.offline = true;
      } else falha(e);
    }
    /* sermões criados neste aparelho e ainda não enviados */
    pendentes().filter(k => k.indexOf('local-') === 0).forEach(k => {
      const m = local.ler(CACHE_MSG + k);
      if (m && !S.lista.some(x => x._local === k)) {
        S.lista.unshift({
          id: '',
          _local: k,
          tema: m.tema,
          pasta: m.pasta,
          tempo: m.tempo,
          nTopicos: m.topicos.length,
          atualizado: new Date(+k.slice(6)).toISOString(),
          busca: ''
        });
      }
    });
    S.carregando = false;
    render();
  }

  /* chave = id do servidor ou "local-…" (criado sem internet) */
  async function abrir(chave) {
    const pend = pendentes().includes(chave),
      copia = local.ler(CACHE_MSG + chave);
    let m = null;
    if ((pend || chave.indexOf('local-') === 0) && copia) m = copia; // alterações deste aparelho têm prioridade
    else {
      try {
        toast('Abrindo…');
        m = await run('obterMensagem', chave);
        guardarMsg(m);
        S.offline = false;
      } catch (e) {
        if (!e.rede) return falha(e);
        m = copia;
        S.offline = true;
        if (!m) return toast('Este sermão ainda não foi aberto neste aparelho. Abra-o uma vez com internet.', true);
        toast('Sem internet: abrindo a cópia salva no aparelho.');
      }
    }
    if (!m) return toast('Sermão não encontrado no aparelho.', true);
    m.topicos.forEach((t, i) => t._open = i === 0);
    S.msg = m;
    S.dirty = false;
    S.ins = null;
    S.sel = '';
    S.view = 'editor';
    render();
    window.scrollTo(0, 0);
    m.topicos.forEach(t => t.blocos.forEach(b => {
      if (b.tipo === 'imagem' && b.url) {
        const im = new Image();
        im.src = b.url;
      }
    }));
    if (pend) {
      S.dirty = true;
      atualizarStatus();
      agendarAuto();
    } // tenta enviar o que ficou pendente
  }

  /* envia ao servidor os sermões alterados sem internet */
  async function sincronizar() {
    if (S.sincronizando || navigator.onLine === false || !lerSessao()) return;
    const lista = pendentes();
    if (!lista.length) return;
    S.sincronizando = true;
    let enviados = 0;
    for (const k of lista) {
      if (S.msg && chaveMsg(S.msg) === k && S.view !== 'lista') {
        if ((await salvar(true)) === true) enviados++;
        continue;
      }
      const m = local.ler(CACHE_MSG + k);
      if (!m) {
        marcarPendente(k, false);
        continue;
      }
      const c = JSON.parse(JSON.stringify(m));
      delete c._local;
      try {
        const r = await run('salvarMensagem', c);
        m.id = r.id;
        m.atualizado = r.atualizado;
        delete m._local;
        if (k.indexOf('local-') === 0) local.apagar(CACHE_MSG + k);
        guardarMsg(m);
        marcarPendente(k, false);
        enviados++;
      } catch (e) {
        if (e.rede) break;
        toast('Não foi possível enviar “' + (m.tema || 'Sem tema') + '”: ' + textoErro(e).replace(/^CONFLITO:\s*/i, '') + (/^CONFLITO/i.test(textoErro(e)) ? ' Abra o sermão para escolher a versão.' : ''), true, null, 9000);
      }
    }
    S.sincronizando = false;
    if (enviados) {
      S.offline = false;
      toast(enviados === 1 ? '1 sermão enviado ao servidor' : enviados + ' sermões enviados ao servidor');
      if (S.view === 'lista') carregarLista();
    }
  }

  /* ---------- salvamento (manual e automático) ---------- */
  let autoT = null;
  function agendarAuto() {
    clearTimeout(autoT);
    if (S.view !== 'editor') return;
    autoT = setTimeout(() => {
      if (S.dirty && S.view === 'editor' && !S.conflito) salvar(true);
    }, ESPERA_AUTO);
  }

  /* silencioso = salvamento automático (sem aviso "Sermão salvo") */
  async function salvar(silencioso) {
    if (S.salvando) {
      agendarAuto();
      return false;
    }
    clearTimeout(autoT);
    clearTimeout(localT);
    const m = S.msg;
    guardarMsg(m);
    marcarPendente(chaveMsg(m), true); // primeiro, a cópia no aparelho
    S.salvando = true;
    atualizarStatus();
    const rev = S.rev,
      copia = JSON.parse(JSON.stringify(m));
    delete copia._local;
    if (S.sobrescrever) copia._sobrescrever = true;
    let r = null,
      erro = null;
    try {
      r = await run('salvarMensagem', copia);
    } catch (e) {
      erro = e;
    }
    S.salvando = false;
    S.sobrescrever = false;
    if (r) {
      m.id = r.id;
      m.atualizado = r.atualizado;
      if (m._local) {
        local.apagar(CACHE_MSG + m._local);
        marcarPendente(m._local, false);
        delete m._local;
      }
      S.dirty = S.rev !== rev; // editou durante o salvamento: continua pendente
      guardarMsg(m);
      if (!S.dirty) marcarPendente(m.id, false);
      S.offline = false;
      atualizarStatus();
      if (S.dirty) agendarAuto();else if (!silencioso) toast('Sermão salvo');
      return true;
    }
    if (erro && erro.rede) {
      // sem internet: fica no aparelho e vai depois
      S.dirty = false;
      S.offline = true;
      atualizarStatus();
      if (!silencioso) toast('Sem internet: salvo no aparelho. Envio quando a conexão voltar.');
      return 'local';
    }
    atualizarStatus();
    if (/^CONFLITO/i.test(textoErro(erro))) return resolverConflito(erro);
    falha(erro);
    if (silencioso) {
      clearTimeout(autoT);
      autoT = setTimeout(() => S.dirty && salvar(true), 15000);
    } // tenta de novo
    return false;
  }

  /* outro aparelho salvou este sermão depois que ele foi aberto aqui */
  async function resolverConflito(erro) {
    S.conflito = true;
    const motivo = textoErro(erro).replace(/^CONFLITO:\s*/i, '');
    const manter = confirm(motivo.charAt(0).toUpperCase() + motivo.slice(1) + '\n\nOK: manter a versão deste aparelho (a outra fica guardada em Versões).' + '\nCancelar: descartar as alterações daqui e abrir a versão salva.');
    S.conflito = false;
    if (manter) {
      S.sobrescrever = true;
      return salvar();
    }
    S.dirty = false;
    marcarPendente(S.msg.id, false);
    local.apagar(CACHE_MSG + S.msg.id); // descarta a cópia deste aparelho
    await abrir(S.msg.id);
    return false;
  }

  /* ======================= tela acesa no modo Pregar ======================= */
  async function manterTela() {
    try {
      if ('wakeLock' in navigator && !S.wake) {
        S.wake = await navigator.wakeLock.request('screen');
        S.wake.addEventListener('release', () => {
          S.wake = null;
        });
      }
      return !!S.wake;
    } catch (e) {
      return false;
    }
  }
  function soltarTela() {
    try {
      if (S.wake) S.wake.release();
    } catch (e) {}
    S.wake = null;
  }

  /* ======================= cronômetro ======================= */
  function tempoDecorrido() {
    return S.pr.acum + (S.pr.inicio ? Date.now() - S.pr.inicio : 0);
  }
  /* soma ao tempo da parte atual o que passou desde a última marca */
  function fecharParte() {
    if (!S.pr.inicio) return;
    const agora = Date.now();
    S.pr.tp[S.pr.i] = (S.pr.tp[S.pr.i] || 0) + agora - S.pr.marca;
    S.pr.marca = agora;
  }
  function tick() {
    const el = document.getElementById('timer');
    if (!el) return;
    const s = Math.floor(tempoDecorrido() / 1000),
      alvo = (S.msg.tempo || 30) * 60;
    el.innerHTML = "<b>" + mmss(s) + "</b><small>de " + mmss(alvo) + "</small>";
    el.className = 'timer' + (s > alvo ? ' over' : s > alvo * 0.85 ? ' warn' : '') + (S.pr.inicio ? '' : ' paused');
    const ph = document.getElementById('playhead');
    if (ph) {
      ph.style.left = Math.min(100, s / alvo * 100) + '%';
      ph.className = s > alvo ? 'over' : '';
    }
    const tp = document.getElementById('tparte');
    if (tp) {
      const i = S.pr.i,
        prev = S.pr.prev[i] ? S.pr.prev[i].min : 0;
      const sp = Math.floor(((S.pr.tp[i] || 0) + (S.pr.inicio ? Date.now() - S.pr.marca : 0)) / 1000);
      tp.innerHTML = "Nesta parte <b>" + mmss(sp) + "</b>" + (prev ? " de " + fmtMin(prev) + " min" : '');
      tp.className = 'tparte' + (prev && sp > prev * 60 ? ' warn' : '');
    }
  }
  /* ======================= teleprompter ======================= */
  /* velocidade: a distância a rolar dividida pelos segundos previstos para a parte, vezes o fator (0,5× a 2×).
   * Para quando o cronômetro está pausado, quando a rolagem foi pausada e por 4 s depois de um toque ou rolagem manual. */
  function teleQuadro(ts) {
    if (S.view !== 'pregar') return;
    requestAnimationFrame(teleQuadro);
    const t = S.pr.tele,
      c = document.getElementById('pgc');
    const dt = t.ultimo ? Math.min(0.25, (ts - t.ultimo) / 1000) : 0;
    t.ultimo = ts;
    if (!c || !tele(S.msg) || !t.rodando || !S.pr.inicio || Date.now() < t.pausaAte) return;
    const dist = c.scrollHeight - c.clientHeight;
    if (dist <= 0 || c.scrollTop >= dist) return;
    const prev = S.pr.prev[S.pr.i] && S.pr.prev[S.pr.i].min > 0 ? S.pr.prev[S.pr.i].min * 60 : 300;
    t.acc += dist / prev * t.fator * dt;
    if (t.acc >= 1) {
      const n = Math.floor(t.acc);
      t.acc -= n;
      t.proprio = true;
      c.scrollTop += n;
    }
  }
  function telePausarToque() {
    if (S.view === 'pregar' && S.pr.tele) S.pr.tele.pausaAte = Date.now() + 4000;
  }
  function entrarPregar() {
    const agora = Date.now();
    S.pr = {
      i: 0,
      acum: 0,
      inicio: agora,
      marca: agora,
      fs: S.pr.fs || 1,
      tp: [],
      prev: temposPartes(S.msg),
      tele: {
        rodando: true,
        fator: S.pr.tele && S.pr.tele.fator || 1,
        pausaAte: 0,
        acc: 0,
        ultimo: 0
      }
    };
    S.ins = null;
    S.view = 'pregar';
    render();
    clearInterval(S.timerId);
    S.timerId = setInterval(tick, 500);
    if (tele(S.msg)) {
      S.pr.tele.pausaAte = Date.now() + 3000;
      requestAnimationFrame(teleQuadro);
    } // 3 s para começar
    manterTela().then(ok => {
      if (!ok && !S.avisouTela) {
        S.avisouTela = true;
        toast('Este navegador não deixou manter a tela acesa. No iPad: Ajustes → Tela e Brilho → Bloqueio Automático → Nunca.', false, null, 8000);
      }
    });
  }
  /* ao sair do Pregar (depois de 1 minuto ou mais), guarda o tempo real de cada parte no sermão */
  function registrarPregacao() {
    fecharParte();
    const total = Math.floor(tempoDecorrido() / 1000);
    if (total < 60) return null;
    const m = S.msg,
      prev = S.pr.prev,
      hoje = new Date().toDateString();
    const reg = {
      data: new Date().toISOString(),
      alvo: m.tempo,
      total,
      partes: m.topicos.map((t, k) => ({
        titulo: t.titulo || 'Parte ' + (k + 1),
        seg: Math.round((S.pr.tp[k] || 0) / 1000),
        prev: prev[k] ? Math.round(prev[k].min * 10) / 10 : 0,
        palavras: palavras(t)
      }))
    };
    const culto = (m.eventos || []).find(e => e.data && new Date(e.data).toDateString() === hoje);
    if (culto) reg.culto = culto.titulo;
    m.pregacoes = (m.pregacoes || []).concat([reg]).slice(-20);
    aprenderRitmo(reg);
    return reg;
  }
  function sairPregar() {
    clearInterval(S.timerId);
    soltarTela();
    S.view = 'editor';
    const reg = registrarPregacao();
    if (reg) {
      S.modal = {
        tipo: 'pregacao',
        i: S.msg.pregacoes.length - 1,
        novo: true
      };
      marcar();
    }
    render();
  }
  function irTopico(k) {
    const n = S.msg.topicos.length;
    if (k < 0 || k >= n) return;
    fecharParte();
    S.pr.i = k;
    render();
    const c = document.getElementById('pgc');
    if (c) c.scrollTop = 0;
    if (S.pr.tele) {
      S.pr.tele.acc = 0;
      S.pr.tele.pausaAte = Date.now() + 2000;
    } // respiro no começo da parte
  }

  /* ======================= eventos ======================= */
  document.addEventListener('click', async e => {
    const el = e.target.closest('[data-a]');
    if (!el || el.disabled) return;
    if (el.classList.contains('ov') && e.target !== el) return; // clique dentro do modal
    const a = el.dataset.a,
      m = S.msg;
    const bl = el.closest('.bl');
    const ti = el.dataset.t != null ? +el.dataset.t : bl ? +bl.dataset.t : -1;
    const bi = bl ? +bl.dataset.b : -1;
    const T = ti >= 0 && m ? m.topicos[ti] : null;
    const B = T && bi >= 0 ? T.blocos[bi] : null;
    const swap = (arr, i, j) => {
      [arr[i], arr[j]] = [arr[j], arr[i]];
    };
    switch (a) {
      case 'lixeira':
        S.modal = {
          tipo: 'lixeira',
          itens: null
        };
        render();
        try {
          S.modal.itens = await run('listarExcluidos');
        } catch (err) {
          S.modal = null;
          falha(err);
        }
        render();
        break;
      case 'restaurarExcluido':
        {
          const v = S.modal.itens[+el.dataset.i];
          try {
            await run('restaurarExcluido', v.id);
            S.modal = null;
            toast('“' + (v.tema || 'Sem tema') + '” voltou para a lista');
            carregarLista();
          } catch (err) {
            falha(err);
          }
          break;
        }
      case 'backup':
        toast('Fazendo backup no Drive…');
        try {
          const r = await run('fazerBackup');
          toast('Backup feito: ' + plural(r.sermoes, 'sermão', 'sermões') + ' em ' + r.pasta, false, r.url ? {
            rotulo: 'Abrir',
            fn: () => window.open(r.url, '_blank')
          } : null, 9000);
        } catch (err) {
          falha(err);
        }
        break;
      case 'versoes':
        if (!m.id) return toast('Este sermão ainda não foi salvo no servidor.', true);
        S.modal = {
          tipo: 'versoes',
          itens: null
        };
        render();
        try {
          S.modal.itens = await run('listarVersoes', m.id);
        } catch (err) {
          S.modal = null;
          falha(err);
        }
        render();
        break;
      case 'restaurarVersao':
        {
          const v = S.modal.itens[+el.dataset.i];
          if (!confirm('Voltar para a versão de ' + fmtDataHoraAno(v.atualizado) + '? A versão atual fica guardada no histórico.')) return;
          if (S.dirty && (await salvar(true)) !== true) return toast('Salve as alterações (com internet) antes de restaurar.', true);
          try {
            await run('restaurarVersao', m.id, v.guardado);
            S.modal = null;
            marcarPendente(m.id, false);
            local.apagar(CACHE_MSG + m.id);
            await abrir(m.id);
            toast('Versão restaurada');
          } catch (err) {
            falha(err);
          }
          break;
        }
      case 'teleprompter':
        m.opcoes = Object.assign({}, m.opcoes, {
          teleprompter: !tele(m)
        });
        if (!m.opcoes.teleprompter) delete m.opcoes.teleprompter;
        marcar();
        render();
        toast(tele(m) ? 'Teleprompter ligado: o texto vai rolar sozinho no modo Pregar.' : 'Teleprompter desligado.');
        break;
      case 'teleRolar':
        {
          const t = S.pr.tele;
          t.rodando = !t.rodando;
          t.pausaAte = 0;
          const b = document.getElementById('telebtn');
          if (b) b.innerHTML = ic(t.rodando ? 'pause' : 'play', 16);
          break;
        }
      case 'teleVel':
        {
          const t = S.pr.tele;
          t.fator = Math.max(0.5, Math.min(2, Math.round((t.fator + 0.1 * +el.dataset.v) * 10) / 10));
          const v = document.getElementById('televel');
          if (v) v.textContent = t.fator.toFixed(1).replace('.', ',') + '×';
          break;
        }
      case 'verPregacao':
        S.modal = {
          tipo: 'pregacao',
          i: +el.dataset.i
        };
        render();
        break;
      case 'descartarPregacao':
        m.pregacoes.splice(S.modal.i, 1);
        S.modal = null;
        marcar();
        render();
        toast('Registro descartado');
        break;
      case 'parear':
        try {
          const r = await run('gerarCodigo');
          S.modal = {
            tipo: 'codigo',
            codigo: String(r.codigo)
          };
          render();
        } catch (err) {
          falha(err);
        }
        break;
      case 'mostrarCodigo':
        {
          const box = document.getElementById('lcodbox');
          if (box) {
            box.innerHTML = vEntrarCodigo();
            const i = document.getElementById('lcodigo');
            if (i) i.focus();
          }
          break;
        }
      case 'entrarCodigo':
        entrarComCodigo();
        break;
      case 'semInternet':
        esconderLogin();
        if (esperaLogin) {
          const w = esperaLogin;
          esperaLogin = null;
          w.falhar(erroRede());
        }
        break;
      case 'sair':
        if (!confirm('Sair da conta neste aparelho? Os sermões ainda não enviados continuam guardados aqui.')) return;
        try {
          const s = lerSessao();
          if (s) await chamar('sair', [], {
            sessao: s.sessao
          });
        } catch (err) {}
        local.apagar(CHAVE_SESSAO);
        try {
          if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
        } catch (err) {}
        S.lista = [];
        carregarLista();
        break;
      case 'desfazer':
        {
          const fn = desfazerFn;
          desfazerFn = null;
          document.getElementById('toast').className = '';
          if (fn) fn();
          break;
        }
      /* lista */
      case 'nova':
        S.msg = novaMsg();
        S.dirty = false;
        S.offline = navigator.onLine === false;
        S.ins = null;
        S.sel = '';
        S.view = 'editor';
        render();
        window.scrollTo(0, 0);
        focar('[data-f="tema"]');
        break;
      case 'abrir':
        abrir(el.dataset.id);
        break;
      case 'excluir':
        {
          e.stopPropagation();
          const id = el.dataset.id;
          try {
            await run('excluirMensagem', id);
            marcarPendente(id, false);
            local.apagar(CACHE_MSG + id);
            toast('Sermão movido para a Lixeira', false, {
              rotulo: 'Desfazer',
              fn: async () => {
                try {
                  await run('restaurarExcluido', id);
                  carregarLista();
                } catch (err) {
                  falha(err);
                }
              }
            });
            carregarLista();
          } catch (err) {
            falha(err);
          }
          break;
        }
      case 'duplicar':
        e.stopPropagation();
        try {
          await run('duplicarMensagem', el.dataset.id);
          toast('Cópia criada');
          carregarLista();
        } catch (err) {
          falha(err);
        }
        break;

      /* editor */
      case 'voltar':
        if (S.dirty && !(await salvar(true)) && !confirm('Não foi possível salvar. Sair mesmo assim e perder as alterações?')) return;
        clearTimeout(autoT);
        S.dirty = false;
        carregarLista();
        break;
      case 'salvar':
        salvar();
        break;
      case 'exportar':
        exportar();
        break;
      case 'pregar':
        if (!m.topicos.length) return toast('Adicione ao menos uma parte.', true);
        if (S.dirty && !(await salvar(true)) && !confirm('Não foi possível salvar. Pregar mesmo assim?')) return;
        entrarPregar();
        break;
      case 'vincular':
        S.modal = {
          itens: null
        };
        render();
        try {
          S.modal.itens = await run('listarEventos');
        } catch (err) {
          S.modal = null;
          falha(err);
        }
        render();
        break;
      case 'pickEvento':
        {
          const ev = S.modal.itens[+el.dataset.i];
          m.eventos = m.eventos || [];
          if (!m.eventos.some(x => x.id === ev.id)) m.eventos.push(ev);
          S.modal = null;
          marcar();
          render();
          break;
        }
      case 'fecharModal':
        S.modal = null;
        render();
        break;
      case 'desvEvento':
        m.eventos.splice(+el.dataset.i, 1);
        marcar();
        render();
        break;
      case 'irParte':
        T._open = true;
        render();
        {
          const sec = document.getElementById('top-' + ti);
          if (sec) sec.scrollIntoView({
            block: 'start',
            behavior: 'smooth'
          });
        }
        break;
      case 'addTopico':
        m.topicos.forEach(t => t._open = false);
        m.topicos.push({
          titulo: 'Parte ' + (m.topicos.length + 1),
          blocos: [],
          _open: true
        });
        S.ins = null;
        S.sel = '';
        marcar();
        render();
        focar("[data-f=\"titulo\"][data-t=\"" + (m.topicos.length - 1) + "\"]");
        break;
      case 'toggle':
        T._open = !T._open;
        if (S.ins && S.ins.ti === ti) S.ins = null;
        render();
        break;
      case 'topUp':
        swap(m.topicos, ti, ti - 1);
        S.ins = null;
        S.sel = '';
        marcar();
        render();
        break;
      case 'topDown':
        swap(m.topicos, ti, ti + 1);
        S.ins = null;
        S.sel = '';
        marcar();
        render();
        break;
      case 'delTopico':
        {
          const alvo = S.msg,
            parte = m.topicos.splice(ti, 1)[0];
          S.ins = null;
          S.sel = '';
          marcar();
          render();
          toast("Parte \u201C" + (parte.titulo || 'Parte ' + (ti + 1)) + "\u201D exclu\xEDda", false, {
            rotulo: 'Desfazer',
            fn: () => {
              if (S.msg !== alvo || S.view !== 'editor') return toast('Não dá mais para desfazer.', true);
              parte._open = true;
              alvo.topicos.splice(Math.min(ti, alvo.topicos.length), 0, parte);
              marcar();
              render();
            }
          });
          break;
        }
      case 'inserir':
        S.ins = S.ins && S.ins.ti === ti ? null : {
          ti,
          q: ''
        };
        atualizarPaleta(ti);
        break;
      case 'addBloco':
        novoBloco(ti, el.dataset.v);
        break;
      case 'buscarVers':
        buscarVers(B, el);
        break;
      case 'egwConferir':
        {
          const termos = String(B.texto || '').replace(/\s+/g, ' ').trim().split(' ').slice(0, 12).join(' ') || String(B.fonte || '').replace(/ellen g\.? white,?/i, '').trim();
          if (!termos) return toast('Escreva ou cole o começo da citação para pesquisar.', true);
          window.open('https://egwwritings.org/search?query=' + encodeURIComponent(termos), '_blank');
          break;
        }
      case 'blUp':
        swap(T.blocos, bi, bi - 1);
        S.sel = ti + ':' + (bi - 1);
        marcar();
        render();
        break;
      case 'blDown':
        swap(T.blocos, bi, bi + 1);
        S.sel = ti + ':' + (bi + 1);
        marcar();
        render();
        break;
      case 'blDel':
        {
          const alvo = S.msg,
            removido = T.blocos.splice(bi, 1)[0];
          S.sel = '';
          marcar();
          render();
          toast((TIPOS[removido.tipo] || TIPOS.texto).nome + " removido", false, {
            rotulo: 'Desfazer',
            fn: () => {
              if (S.msg !== alvo || S.view !== 'editor' || alvo.topicos.indexOf(T) < 0) return toast('Não dá mais para desfazer.', true);
              T.blocos.splice(Math.min(bi, T.blocos.length), 0, removido);
              T._open = true;
              S.sel = ti + ':' + bi;
              marcar();
              render();
            }
          });
          break;
        }
      case 'addItem':
        B.itens.push('');
        marcar();
        render();
        focar(".bl[data-t=\"" + ti + "\"][data-b=\"" + bi + "\"] [data-li=\"" + (B.itens.length - 1) + "\"]");
        break;
      case 'delItem':
        B.itens.splice(+el.dataset.li, 1);
        marcar();
        render();
        break;

      /* pregar */
      case 'sairPregar':
        sairPregar();
        break;
      case 'pgIr':
        irTopico(+el.dataset.v);
        break;
      case 'fonte':
        S.pr.fs = Math.max(0.7, Math.min(2.2, +(S.pr.fs + 0.15 * +el.dataset.v).toFixed(2)));
        document.querySelector('.pg').style.setProperty('--fs', S.pr.fs);
        break;
      case 'timer':
        if (S.pr.inicio) {
          fecharParte();
          S.pr.acum += Date.now() - S.pr.inicio;
          S.pr.inicio = 0;
        } else {
          S.pr.inicio = Date.now();
          S.pr.marca = S.pr.inicio;
        }
        tick();
        break;
    }
  });

  /* tocar num bloco o seleciona (no iPad os botões ficam escondidos até isso) */
  app.addEventListener('click', e => {
    const bl = e.target.closest && e.target.closest('.bl');
    if (bl) selecionar(bl);
  });
  app.addEventListener('focusin', e => {
    const bl = e.target.closest && e.target.closest('.bl');
    if (bl) selecionar(bl);
  });
  app.addEventListener('input', e => {
    const el = e.target,
      f = el.dataset.f;
    if (!f || f === 'arquivo' || f === 'importar') return;
    if (f === 'filtro') {
      S.filtro = el.value;
      document.getElementById('res').innerHTML = vResultados();
      return;
    }
    if (f === 'ins') {
      const ti = +el.dataset.t;
      if (el.value.startsWith('/')) S.ins = {
        ti,
        q: el.value.slice(1).trim()
      };else if (S.ins && S.ins.ti === ti && S.ins.q) S.ins = null; // apagou a barra: fecha a paleta aberta pelo "/"
      atualizarPaleta(ti);
      return;
    }
    const m = S.msg;
    if (f === 'tema' || f === 'pasta') m[f] = el.value;else if (f === 'tempo') m.tempo = +el.value;else if (f === 'titulo') m.topicos[+el.dataset.t].titulo = el.value;else if (f === 'ttempo') {
      const t = m.topicos[+el.dataset.t],
        v = Math.round(+el.value);
      if (v > 0) t.tempo = v;else delete t.tempo;
    } else {
      const bl = el.closest('.bl');
      if (!bl) return;
      const b = m.topicos[+bl.dataset.t].blocos[+bl.dataset.b];
      if (f === 'conferida') {
        if (el.checked) b.conferida = true;else delete b.conferida;
        marcar();
        return;
      }
      if (f === 'item') b.itens[+el.dataset.li] = el.value;else b[f] = el.value;
      if (b.tipo === 'citacao' && (f === 'texto' || f === 'fonte')) {
        if (b.conferida) {
          delete b.conferida;
          const c = bl.querySelector('[data-f="conferida"]');
          if (c) c.checked = false;
        }
        if (f === 'fonte') {
          const x = bl.querySelector('.citx');
          if (x) x.outerHTML = vCitacaoExtras(b);
        }
      }
    }
    if (el.tagName === 'TEXTAREA') autosize(el);
    marcar();
  });
  app.addEventListener('paste', e => {
    const el = e.target,
      bl = el.closest && el.closest('.bl.t-citacao');
    if (!bl || el.dataset.f !== 'texto' || !e.clipboardData) return;
    const lido = lerColagemEGW(e.clipboardData.getData('text/plain') || '');
    if (!lido) return;
    const b = S.msg.topicos[+bl.dataset.t].blocos[+bl.dataset.b];
    e.preventDefault();
    const ini = el.selectionStart,
      fim = el.selectionEnd;
    b.texto = (b.texto || '').slice(0, ini) + lido.texto + (b.texto || '').slice(fim);
    if (!String(b.fonte || '').replace(/ellen g\.? white,?\s*/i, '').trim()) b.fonte = lido.fonte;
    delete b.conferida;
    marcar();
    render();
    toast('Referência reconhecida: ' + lido.codigo + '. Confira o texto e marque "Conferida na fonte".', false, null, 6000);
  });
  app.addEventListener('keydown', e => {
    const el = e.target,
      f = el.dataset && el.dataset.f;
    /* o tema é uma linha só, mesmo sendo textarea */
    if (f === 'tema' && e.key === 'Enter') {
      e.preventDefault();
      el.blur();
      return;
    }
    /* Enter na referência ou na versão de um Versículo busca o texto */
    if ((f === 'ref' || f === 'versao') && e.key === 'Enter') {
      e.preventDefault();
      const bl = el.closest('.bl');
      buscarVers(S.msg.topicos[+bl.dataset.t].blocos[+bl.dataset.b], bl.querySelector('[data-a="buscarVers"]'));
      return;
    }
    /* campo "Escreva aqui ou digite /": Enter cria o bloco */
    if (f === 'ins') {
      const ti = +el.dataset.t,
        v = el.value;
      if (e.key === 'Enter') {
        e.preventDefault();
        if (v.startsWith('/')) {
          const k = tiposFiltrados(v.slice(1).trim())[0];
          if (k) novoBloco(ti, k);
        } else if (v.trim()) novoBloco(ti, 'texto', v.trim());else if (S.ins && S.ins.ti === ti) {
          const k = tiposFiltrados(S.ins.q)[0];
          if (k) novoBloco(ti, k);
        }
      } else if (e.key === 'Escape' && S.ins) {
        e.stopPropagation();
        S.ins = null;
        el.value = '';
        atualizarPaleta(ti);
      }
      return;
    }
    /* Enter numa lista cria o próximo item; Backspace num item vazio apaga */
    if (f === 'item') {
      const bl = el.closest('.bl'),
        ti = +bl.dataset.t,
        bi = +bl.dataset.b,
        li = +el.dataset.li;
      const b = S.msg.topicos[ti].blocos[bi];
      if (e.key === 'Enter') {
        e.preventDefault();
        b.itens.splice(li + 1, 0, '');
        marcar();
        render();
        focar(".bl[data-t=\"" + ti + "\"][data-b=\"" + bi + "\"] [data-li=\"" + (li + 1) + "\"]");
      } else if (e.key === 'Backspace' && el.value === '' && b.itens.length > 1) {
        e.preventDefault();
        b.itens.splice(li, 1);
        marcar();
        render();
        focar(".bl[data-t=\"" + ti + "\"][data-b=\"" + bi + "\"] [data-li=\"" + Math.max(0, li - 1) + "\"]");
      }
    }
  });
  app.addEventListener('change', async e => {
    const el = e.target;
    if (el.dataset.f === 'importar') {
      const f = el.files[0];
      el.value = '';
      if (f) importar(f);
      return;
    }
    if (el.dataset.f !== 'arquivo' || !el.files[0]) return;
    const bl = el.closest('.bl'),
      b = S.msg.topicos[+bl.dataset.t].blocos[+bl.dataset.b];
    try {
      toast('Enviando imagem…');
      const dataUrl = await reduzirImagem(el.files[0]);
      b.url = await run('enviarImagem', dataUrl, el.files[0].name.replace(/\.\w+$/, '') + '.jpg');
      marcar();
      render();
      toast('Imagem enviada');
    } catch (err) {
      falha(err);
    }
  });
  function reduzirImagem(file) {
    return new Promise((ok, fail) => {
      const r = new FileReader();
      r.onload = () => {
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, 1600 / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * k);
          c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          ok(c.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = () => fail(new Error('Não foi possível ler a imagem.'));
        img.src = r.result;
      };
      r.onerror = () => fail(new Error('Não foi possível ler o arquivo.'));
      r.readAsDataURL(file);
    });
  }

  /* atalhos de teclado */
  document.addEventListener('keydown', e => {
    if (e.target && e.target.id === 'lcodigo' && e.key === 'Enter') {
      e.preventDefault();
      entrarComCodigo();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && S.view === 'editor') {
      e.preventDefault();
      salvar();
    }
    if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('card') && e.target.dataset.a === 'abrir') abrir(e.target.dataset.id);
    if (S.view === 'pregar') {
      if (e.key === 'ArrowRight' || e.key === 'PageDown') irTopico(S.pr.i + 1);
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') irTopico(S.pr.i - 1);
      if (e.key === 'Escape') {
        sairPregar();
        return;
      } // não deixa o mesmo Esc fechar o resumo da pregação
    }
    if (e.key === 'Escape' && S.modal) {
      S.modal = null;
      render();
    } else if (e.key === 'Escape' && S.ins) {
      const ti = S.ins.ti;
      S.ins = null;
      atualizarPaleta(ti);
    }
  });

  /* deslizar para trocar de parte no modo Pregar */
  let toqueX = null,
    toqueY = null;
  app.addEventListener('touchstart', e => {
    if (S.view === 'pregar') {
      toqueX = e.touches[0].clientX;
      toqueY = e.touches[0].clientY;
      telePausarToque();
    }
  }, {
    passive: true
  });
  app.addEventListener('wheel', telePausarToque, {
    passive: true
  });
  app.addEventListener('scroll', e => {
    if (S.view !== 'pregar' || !S.pr.tele || e.target.id !== 'pgc') return;
    if (S.pr.tele.proprio) S.pr.tele.proprio = false;else telePausarToque();
  }, {
    passive: true,
    capture: true
  });
  app.addEventListener('touchend', e => {
    if (S.view !== 'pregar' || toqueX === null) return;
    const dx = e.changedTouches[0].clientX - toqueX,
      dy = e.changedTouches[0].clientY - toqueY;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) irTopico(S.pr.i + (dx < 0 ? 1 : -1));
    toqueX = null;
  });

  /* ao sair do app (trocar de aba, bloquear o iPad): salva já; ao voltar ao Pregar: pede a tela acesa de novo */
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && S.msg && S.view !== 'lista' && S.dirty) {
      guardarMsg(S.msg);
      marcarPendente(chaveMsg(S.msg), true);
      salvar(true);
    }
    if (document.visibilityState === 'visible') {
      if (S.view === 'pregar') manterTela();
      sincronizar();
    }
  });
  /* ao fechar: a cópia no aparelho já basta (é enviada na próxima abertura); sem aviso de "sair da página" */
  window.addEventListener('pagehide', () => {
    if (S.msg && S.view !== 'lista' && S.dirty) {
      guardarMsg(S.msg);
      marcarPendente(chaveMsg(S.msg), true);
    }
  });
  window.addEventListener('online', () => {
    S.offline = false;
    sincronizar();
    if (S.view === 'lista') carregarLista();
  });
  window.addEventListener('offline', () => {
    S.offline = true;
    if (S.view === 'lista') render();
  });

  /* app instalável e com cópia das telas no aparelho (só em https: no GitHub Pages) */
  function registrarSW() {
    try {
      if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
    } catch (e) {}
  }
  registrarSW();
  if (!CFG.api || !CFG.client) mostrarConfig();else carregarLista().then(sincronizar);
})();
</script>
