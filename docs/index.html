<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sermões</title>
<meta name="theme-color" content="#131218">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sermões">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- preenchidos pelo build a partir de config.json (não são segredos) -->
<meta name="sermoes:api" content="https://script.google.com/macros/s/AKfycbySBYOLyDAFsIJ_lypm6nDnUI9Z0AJ-bNBawpk7MkFR1Hz77Q9QDWDDskO8l-DIrqG-9Q/exec">
<meta name="sermoes:client" content="979972087523-0cd5k7lvnftv5lrir4q8jhhf0oj2najb.apps.googleusercontent.com">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Identidade "Linha do tempo": grafite-violeta, acento azul-céu */
:root{
  --bg:#131218;--bg2:#0f0e13;--s1:#1c1b23;--s2:#25232e;--s3:#3b3848;--bd:#2f2c3a;
  --tx:#efecf5;--mu:#a19bb0;--ac:#82b8ff;--ac2:#5d8fd6;--acd:#17223a;--acx:#0b1830;--feito:#3b4f73;
  --warn:#ffb86b;--dan:#ff6b5b;
  --fd:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fb:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fb);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,textarea,select{font:inherit;color:var(--tx)}
svg{flex:none}
.sp{flex:1}
.muted{color:var(--mu)}

/* botões */
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--bd);font-weight:700;font-size:15px;white-space:nowrap}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.btn:disabled{opacity:.35;cursor:default}
.ic{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;color:var(--tx)}
.ic.fill{background:var(--s1)}
.ic.sm{width:36px;height:36px;border-radius:18px;color:var(--mu)}
.ic:disabled{opacity:.25;cursor:default}
.link{display:inline-flex;align-items:center;gap:6px;min-height:40px;color:var(--ac);font-size:15px}
.link.danger{color:var(--dan)}
.pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--bd);border-radius:20px;background:var(--s1);font-size:15px;color:var(--tx);max-width:100%}
.pill svg{color:var(--mu)}
.pill input,.pill select{background:none;border:0;outline:0;font-size:15px;min-width:0;padding:0}
.pill select{appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:2px}
.pill select option{background:var(--s2);color:var(--tx)}
.pill.add{border-style:dashed;border-color:var(--s3);background:none;color:var(--ac)}
.pill.add svg{color:var(--ac)}
.pill.ev{padding-right:4px}
.pill.on{background:var(--acd);border-color:var(--ac2);color:var(--ac)}
.pill.on svg{color:var(--ac)}
.telec{display:flex;align-items:center;gap:4px;margin-right:6px;padding-right:10px;border-right:1px solid var(--bd)}
.televel{min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums;color:var(--mu);font-size:14px}
.pgc.tele{scroll-behavior:auto;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 calc(100% - 56px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 28px,#000 calc(100% - 56px),transparent 100%)}
.status{font-size:14px;color:var(--mu);margin-right:4px}
.status.dirty{color:var(--ac)}
.status.pend{color:var(--warn)}

/* barra superior */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 32px 14px;background:rgba(19,18,24,.92);backdrop-filter:blur(10px)}

/* lista de sermões */
.lhead{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px;padding:calc(36px + env(safe-area-inset-top)) 48px 12px}
.logo{flex:1;margin:0;font-family:var(--fd);font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1}
.busca{display:flex;align-items:center;gap:8px;width:280px;height:48px;padding:0 16px;border-radius:24px;background:var(--s1);border:1px solid var(--bd);color:var(--mu)}
.busca input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px}
.lhead .btn{height:48px;border-radius:24px;padding:0 20px;font-size:16px}
.lhead .imp{cursor:pointer}
.lhead .imp input{display:none}
.wrap{max-width:1180px;margin:0 auto;padding:8px 48px 140px}
.sec{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:28px 0 14px}
.card{position:relative;cursor:pointer;border:1px solid var(--bd);background:var(--s1)}
.card:hover{border-color:var(--s3)}
.card .acts{position:absolute;top:12px;right:12px;display:flex;gap:2px}
.feat{display:flex;flex-direction:column;gap:18px;padding:28px;border-radius:20px}
.feat .ft{font-family:var(--fd);font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1;padding-right:90px}
.tag{display:inline-flex;align-items:center;padding:4px 10px;border-radius:12px;background:var(--acd);color:var(--ac);font-weight:700;font-size:15px}
.fmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:15px;color:var(--mu)}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:16px;color:var(--mu)}
.meta b{color:var(--tx)}
.mini{display:flex;gap:4px;height:12px}
.mini span{flex:1;border-radius:6px;background:var(--ac)}
.mini span:nth-child(even){background:var(--ac2)}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-direction:column;gap:4px;padding:16px 100px 16px 20px;border-radius:16px}
.row .ct{font-size:19px;font-weight:700;line-height:1.3}
.row .cm{font-size:15px;color:var(--mu)}
.aviso{max-width:1084px;margin:4px auto 0;padding:10px 16px;border-radius:12px;background:#2a2016;color:var(--warn);font-size:15px}
.pendtag{color:var(--warn)}
.vazio{border:1px dashed var(--s3);border-radius:16px;padding:32px 20px;text-align:center;color:var(--mu);line-height:1.6}

/* editor */
.ed{max-width:1060px;margin:0 auto;padding:12px 48px 160px}
.tema{display:block;width:100%;padding:0;background:none;border:0;outline:0;resize:none;overflow:hidden;font-family:var(--fd);font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.tema::placeholder{color:var(--s3)}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.tl{display:flex;gap:4px;height:34px;margin-top:28px}
.tl button{min-width:28px;padding:0 10px;border-radius:8px;background:var(--s2);color:var(--mu);font-size:13px;font-weight:700;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tl button.on{background:var(--ac);color:var(--acx)}
.tlcap{font-size:14px;color:var(--mu);margin-top:8px}
.tlcap .warn,.pmeta .warn{color:var(--warn)}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:-6px}
.pill.sm{height:34px;padding:0 12px;font-size:14px;gap:6px}
.pill input[type=number]{width:2.6em;text-align:right;-moz-appearance:textfield}
.pill input[type=number]::-webkit-inner-spin-button,.pill input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pill input::placeholder{color:var(--mu)}
.partes{display:grid;grid-template-columns:48px minmax(0,1fr);column-gap:18px;margin-top:34px}
.no{display:flex;flex-direction:column;align-items:center}
.no b{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--s3);color:var(--mu);font-size:14px;display:flex;align-items:center;justify-content:center}
.no.on b{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.no.add b{border-style:dashed;color:var(--ac)}
.no i{flex:1;width:2px;margin:4px 0;background:var(--bd)}
.pt{padding-bottom:26px;min-width:0}
.tt{display:flex;align-items:center;gap:12px;min-height:34px;font-size:20px;text-align:left;max-width:100%}
.tt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt small{flex:none;font-size:14px;color:var(--mu)}
.po{display:flex;flex-direction:column;gap:18px;padding-bottom:34px;min-width:0}
.ph{display:flex;align-items:center;gap:2px;min-height:34px}
.ph input{flex:1;min-width:0;height:36px;padding:0;background:none;border:0;outline:0;font-family:var(--fd);font-size:28px;font-weight:600;letter-spacing:-.02em}
.ph input:focus{box-shadow:0 2px 0 var(--ac)}

/* blocos */
.bl{display:flex;flex-direction:column;gap:6px}
.bh{display:flex;align-items:center;gap:2px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.bh span{margin-right:auto}
.bh button{visibility:hidden}
.bl.sel .bh button,.bl:focus-within .bh button{visibility:visible}
.bc{display:flex;flex-direction:column;gap:8px;border-radius:14px}
.bl:focus-within .bc{box-shadow:0 0 0 1px var(--ac2)}
.t-texto .bc{padding:8px 10px;margin:0 -10px}
.t-biblico .bc{padding:14px 18px;background:var(--acd)}
.t-citacao .bc{padding:14px 18px;border:1px solid var(--bd)}
.t-obs .bc{padding:12px 16px;background:var(--s1)}
.t-lista .bc,.t-imagem .bc{padding:12px 16px;border:1px dashed var(--bd)}
.ta{display:block;width:100%;padding:0;background:none;border:0;outline:0;resize:none;overflow:hidden;font-size:18px;line-height:1.6;color:var(--tx)}
.ta::placeholder{color:var(--s3)}
.t-biblico .ta{font-style:italic}
.t-obs .ta{font-size:16px;color:#c9c3d6}
.ref{display:flex;gap:10px}
.ref input{background:none;border:0;outline:0;padding:0;font-size:15px;font-weight:700;color:var(--ac)}
.ref input:first-child{flex:1;min-width:0}
.ref input.ver{width:80px;text-align:right;color:var(--mu)}
.ref .buscar{display:inline-flex;align-items:center;gap:6px;height:32px;margin:-4px -6px -4px 0;padding:0 12px;border-radius:16px;background:var(--ac);color:var(--acx);font-size:14px;font-weight:700;white-space:nowrap}
.ref .buscar:disabled{opacity:.5;cursor:default}
.copy{font-size:12px;color:var(--mu);line-height:1.4}
.citx{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:14px}
.citx .link{font-size:14px;min-height:32px}
.chk{display:inline-flex;align-items:center;gap:8px;color:var(--mu);cursor:pointer;min-height:32px}
.chk input{width:18px;height:18px;accent-color:var(--ac)}
.citx .warn{color:var(--warn)}
.r-conf{margin-left:.6em;padding:.05em .45em;border-radius:6px;border:1px solid var(--warn);color:var(--warn);font-size:.85em}
.fonte{background:none;border:0;outline:0;padding:0;font-size:15px;color:var(--mu);width:100%}
.li{display:flex;align-items:center;gap:10px}
.li::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ac);flex:none}
.prev{max-width:100%;max-height:260px;border-radius:10px;align-self:flex-start}
.up{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:20px;background:var(--s2);font-size:15px;cursor:pointer;align-self:flex-start}
.up input{display:none}
.inp2{background:none;border:0;border-bottom:1px solid var(--bd);outline:0;padding:6px 0;font-size:16px;width:100%}

/* inserir bloco */
.ins{display:flex;align-items:center;gap:8px}
.ins input{flex:1;min-width:0;height:48px;padding:0 16px;border-radius:12px;border:1px dashed var(--s3);background:none;outline:0;font-size:17px}
.ins input:focus{border:1px solid var(--ac)}
.ins input::placeholder{color:var(--mu)}
.pal{width:340px;max-width:100%;display:flex;flex-direction:column;padding:6px;margin-top:8px;border-radius:14px;background:var(--s2);border:1px solid var(--s3)}
.pal button{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:10px;font-size:16px;text-align:left}
.pal button span{flex:1}
.pal button small{color:var(--mu);font-size:13px}
.pal button.on,.pal button:hover{background:var(--acd)}
.pal p{margin:0;padding:10px 12px;color:var(--mu);font-size:15px}
.pfoot{display:flex;justify-content:flex-end}

/* modal */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,9,14,.75);display:flex;align-items:center;justify-content:center;padding:20px}
.md{width:min(560px,100%);max-height:80vh;display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--bd);border-radius:20px;overflow:hidden}
.mh{display:flex;align-items:center;justify-content:space-between;padding:10px 10px 10px 20px;border-bottom:1px solid var(--bd);font-family:var(--fd);font-size:20px}
.ml{overflow-y:auto;padding:8px}
.ml p{padding:12px}
.mi{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:12px;text-align:left}
.mi:hover{background:var(--s2)}
.mi small{color:var(--mu)}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;z-index:30;padding:12px 18px;border-radius:14px;background:var(--s2);border:1px solid var(--s3);color:var(--tx);font-size:15px;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
body:has(.pg) #toast{bottom:auto;top:76px}
#toast.err{background:#5a1d18;border-color:#7a2a22}
#toast.acao{pointer-events:auto;display:flex;align-items:center;gap:14px}
#toast .undo{color:var(--ac);font-weight:700;min-height:32px;padding:0 4px}

/* modo pregar */
.pg{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg2)}
.pgbar{display:flex;align-items:center;gap:10px;padding:calc(16px + env(safe-area-inset-top)) 28px 16px}
.pgtema{flex:1;min-width:0;font-size:15px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fs{font-weight:700}
.pgc{flex:1;overflow-y:auto;padding:12px max(28px,calc((100vw - 940px)/2)) 60px;font-size:calc(26px*var(--fs));line-height:1.5}
.pgk{color:var(--ac);font-size:.55em;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.pgt{font-family:var(--fd);font-size:2em;font-weight:700;line-height:1.05;letter-spacing:-.03em;margin:.2em 0 .7em}
.r-bib{margin:0 0 1.1em;padding:.6em .85em;border-radius:14px;background:var(--acd)}
.r-ref{color:var(--ac);font-weight:700;font-size:.62em;letter-spacing:.03em}
.r-ref span{color:var(--mu);font-weight:400;margin-left:.4em}
.r-bib p{font-style:italic;margin:.25em 0 0;white-space:pre-wrap}
.r-copy{display:block;margin-top:.6em;font-size:.42em;color:var(--mu);line-height:1.4}
.r-txt{margin:0 0 1em;white-space:pre-wrap}
.r-list{margin:0 0 1.1em;padding-left:1.2em}
.r-list li{margin:.25em 0}
.r-list li::marker{color:var(--ac)}
.r-cit{margin:0 0 1.2em;padding:.7em .9em;border-radius:14px;border:1px solid var(--bd)}
.r-cit p{margin:0;white-space:pre-wrap}
.r-cit cite{display:block;margin-top:.5em;font-size:.6em;color:var(--mu);font-style:normal}
.r-obs{margin:0 0 1.1em;padding:.55em .8em;border-radius:12px;background:var(--s1);font-size:.66em;color:#c9c3d6;white-space:pre-wrap}
.r-obs b{color:var(--ac);margin-right:.4em}
.r-img{margin:0 0 1.2em}
.r-img img{max-width:100%;border-radius:12px;display:block}
.r-img figcaption{font-size:.6em;color:var(--mu);margin-top:.4em}
.pgf{display:flex;flex-direction:column;gap:14px;padding:18px 28px calc(20px + env(safe-area-inset-bottom));background:#16151c;border-top:1px solid var(--bd)}
.seg{position:relative;display:flex;gap:4px;height:40px}
.seg button{min-width:22px;padding:0 10px;border-radius:8px;background:var(--s2);color:var(--mu);font-size:13px;font-weight:700;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.seg button.feito{background:var(--feito);color:#c6dbff}
.seg button.on{background:var(--ac);color:var(--acx)}
#playhead{position:absolute;top:-8px;bottom:-8px;left:0;width:3px;margin-left:-1px;border-radius:2px;background:var(--tx);transition:left .6s;pointer-events:none}
#playhead.over{background:var(--dan)}
.pgnav{display:flex;align-items:center;gap:14px}
.tparte{font-size:15px;color:var(--mu);white-space:nowrap}
.tparte b{color:var(--tx);font-variant-numeric:tabular-nums}
.tparte.warn,.tparte.warn b{color:var(--warn)}
.timer{display:inline-flex;align-items:baseline;gap:10px;height:56px;padding:0 4px;border-radius:14px}
.timer b{font-family:var(--fd);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:56px}
.timer small{font-size:16px;color:var(--mu)}
.timer.warn b{color:var(--warn)}
.timer.over{background:var(--dan);padding:0 14px}
.timer.over b,.timer.over small{color:#fff}
.timer.paused{opacity:.45}
.pv{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:28px;background:var(--s2)}
.pv:disabled,.nx:disabled{opacity:.3;cursor:default}
.nx{display:inline-flex;align-items:center;gap:10px;height:56px;max-width:46vw;padding:0 24px;border-radius:28px;background:var(--ac);color:var(--acx);font-size:16px;font-weight:700}
.nx span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* entrada (login com Google) */
#login{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
#login.on{display:flex}
#login.sobre{background:rgba(10,9,14,.85)}
.lbox{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.lbox .logo{flex:none}
.lbox p{margin:0;color:var(--mu);line-height:1.5}
#gbtn{min-height:44px;display:flex;justify-content:center}
.lbox .off{display:flex;flex-direction:column;gap:10px;align-items:center}
.lbox .err{color:var(--dan)}
#lcodbox{display:flex;justify-content:center;width:100%}
.lcod{display:flex;gap:8px;justify-content:center;align-items:center}
.lcod input{width:8.5em;height:48px;padding:0 14px;border-radius:24px;border:1px solid var(--bd);background:var(--s1);outline:0;text-align:center;font-size:22px;letter-spacing:.18em;font-variant-numeric:tabular-nums}
.lcod input:focus{border-color:var(--ac)}
.lcod .btn{height:48px;border-radius:24px}
.vr{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px}
.vr:hover{background:var(--s2)}
.vr div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.vr small{color:var(--mu)}
.vr .btn{height:38px;padding:0 14px;font-size:14px}
.pres{display:flex;align-items:baseline;gap:10px;padding:8px 12px 4px}
.pres b{font-family:var(--fd);font-size:34px;font-variant-numeric:tabular-nums}
.pres span{color:var(--mu)}
.ptab{width:calc(100% - 24px);margin:8px 12px;border-collapse:collapse;font-size:15px}
.ptab th{text-align:left;color:var(--mu);font-weight:400;font-size:13px;padding:6px 4px;border-bottom:1px solid var(--bd)}
.ptab td{padding:7px 4px;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
.ptab td:first-child{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mais{color:var(--warn)}
.menos{color:var(--ac)}
.outras{display:flex;flex-wrap:wrap;gap:6px;padding:4px 12px}
.chip2{height:30px;padding:0 10px;border-radius:15px;border:1px solid var(--bd);font-size:13px;color:var(--mu)}

<script>
/* Mostra qualquer erro na tela em vez de deixar a página em branco */
(function () {
  function mostrar(msg) {
    var d = document.getElementById('erro-fatal');
    if (!d) {
      d = document.createElement('div');
      d.id = 'erro-fatal';
      d.style.cssText = 'position:fixed;left:16px;right:16px;top:16px;z-index:99;padding:16px 18px;border-radius:12px;background:#5a1d18;color:#fff;font:15px/1.5 system-ui,sans-serif;white-space:pre-wrap';
      (document.body || document.documentElement).appendChild(d);
    }
    d.textContent = 'Erro no app: ' + msg + '\n\nTire um print desta mensagem.';
  }
  window.addEventListener('error', function (e) {
    mostrar(e.message + (e.lineno ? ' (linha ' + e.lineno + ')' : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    mostrar(e.reason && e.reason.message || String(e.reason));
  });
})();
</script>

    download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
    scroll: '<path d="M8 21h12a2 2 0 0 0 2-2v-2H10v2a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v3h4"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M14 8h-4"/><path d="M15 12h-5"/>',
    pause: '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',
    history: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
    archive: '<rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/>',
    cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
    phone: '<rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>',
    logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
    upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>'
  };
  const ic = (n, s = 20) => "<svg width=\"" + s + "\" height=\"" + s + "\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">" + ICON[n] + "</svg>";

  /* ======================= modelo ======================= */
  const TEMPOS = [20, 30, 40, 50, 60, 90, 120];
  const VERSOES = ['NBV', 'NVI', 'NVI 2011', 'BLT', 'OL', 'ARA', 'NAA']; /* sugestões; ARA e NAA são preenchidas à mão */
  const LIMITE = 49000; /* igual a LIMITE_DADOS no Code.gs */
  const ESPERA_AUTO = 2500; /* ms sem digitar antes do salvamento automático */
  /* A ordem aqui é a ordem da paleta "Inserir". atalho = letra depois da barra (/v, /p…) */
  const TIPOS = {
    biblico: {
      nome: 'Versículo',
      atalho: 'v',
      icon: 'book',
      novo: () => ({
        tipo: 'biblico',
        ref: '',
        versao: 'NBV',
        texto: ''
      })
    },
    texto: {
      nome: 'Parágrafo',
      atalho: 'p',
      icon: 'type',
      novo: () => ({
        tipo: 'texto',
        texto: ''
      })
    },
    lista: {
      nome: 'Lista',
      atalho: 'l',
      icon: 'list',
      novo: () => ({
        tipo: 'lista',
        itens: ['']
      })
    },
    citacao: {
      nome: 'Citação',
      atalho: 'c',
      icon: 'quote',
      novo: () => ({
        tipo: 'citacao',
        texto: '',
        fonte: ''
      })
    },
    egw: {
      nome: 'Citação de Ellen White',
      atalho: 'e',
      icon: 'quote',
      novo: () => ({
        tipo: 'citacao',
        texto: '',
        fonte: 'Ellen G. White, '
      })
    },
    // só na paleta
    imagem: {
      nome: 'Imagem',
      atalho: 'i',
      icon: 'image',
      novo: () => ({
        tipo: 'imagem',
        url: '',
        legenda: ''
      })
    },
    obs: {
      nome: 'Nota para mim',
      atalho: 'n',
      icon: 'note',
      novo: () => ({
        tipo: 'obs',
        texto: ''
      })
    }
  };
  /* _local = chave no aparelho enquanto o sermão novo não tem id do servidor */
  const tele = m => !!(m && m.opcoes && m.opcoes.teleprompter);
  const novaMsg = () => ({
    id: '',
    _local: 'local-' + Date.now(),
    tema: '',
    pasta: '',
    tempo: 30,
    eventos: [],
    topicos: [{
      titulo: 'Parte 1',
      blocos: [],
      _open: true
    }]
  });
  const S = {
    view: 'lista',
    lista: [],
    carregando: true,
    filtro: '',
    msg: null,
    dirty: false,
    salvando: false,
    rev: 0,
    sobrescrever: false,
    conflito: false,
    modal: null,
    ins: null,
    /* paleta "Inserir" aberta: { ti, q } */
    sel: '',
    /* bloco selecionado "ti:bi" (mostra os botões de mover/remover) */
    pr: {
      i: 0,
      acum: 0,
      inicio: 0,
      marca: 0,
      fs: 1,
      tp: [],
      prev: []
    },
    timerId: null,
    wake: null,
    avisouTela: false,
    offline: false,
    sincronizando: false /* sem conexão com o servidor; enviando pendências */
  };

  /* ======================= utilidades ======================= */
  const app = document.getElementById('app');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[c]);
  /* ======================= configuração ======================= */
  /* preenchidas pelo build (config.json); vazias = configuração pendente */
  const meta = n => {
    const m = document.querySelector('meta[name="' + n + '"]');
    const v = m ? m.content.trim() : '';
    return /^\{\{/.test(v) ? '' : v;
  };
  const CFG = {
    api: meta('sermoes:api'),
    client: meta('sermoes:client')
  };

  /* ======================= armazenamento no aparelho ======================= */
  /* localStorage pode falhar (navegação privada, espaço cheio): tudo protegido */
  const local = {
    ler(k) {
      try {
        const v = localStorage.getItem(k);
        return v ? JSON.parse(v) : null;
      } catch (e) {
        return null;
      }
    },
    gravar(k, v) {
      try {
        localStorage.setItem(k, JSON.stringify(v));
        return true;
      } catch (e) {
        return false;
      }
    },
    apagar(k) {
      try {
        localStorage.removeItem(k);
      } catch (e) {}
    }
  };
  const CHAVE_SESSAO = 'sermoes.sessao',
    CACHE_LISTA = 'sermoes.lista',
    CACHE_MSG = 'sermoes.msg.',
    CACHE_PEND = 'sermoes.pend';
  const chaveMsg = m => m.id || m._local;
  const pendentes = () => local.ler(CACHE_PEND) || [];
  function marcarPendente(chave, sim) {
    if (!chave) return;
    const p = new Set(pendentes());
    if (sim) p.add(chave);else p.delete(chave);
    local.gravar(CACHE_PEND, [...p]);
  }
  /* o aparelho guarda no máximo MAX_CACHE sermões (os usados mais recentemente); pendentes nunca são apagados */
  const CACHE_USO = 'sermoes.uso',
    MAX_CACHE = 40;
  function liberarEspaco(qtd) {
    const uso = local.ler(CACHE_USO) || {},
      pend = new Set(pendentes());
    const livres = Object.keys(uso).filter(k => !pend.has(k)).sort((a, b) => uso[a] - uso[b]);
    const sobra = Math.max(qtd || 0, Object.keys(uso).length - MAX_CACHE);
    livres.slice(0, sobra).forEach(k => {
      delete uso[k];
      local.apagar(CACHE_MSG + k);
    });
    local.gravar(CACHE_USO, uso);
  }
  function guardarMsg(m) {
    const c = JSON.parse(JSON.stringify(m)),
      chave = chaveMsg(m);
    c.topicos.forEach(t => delete t._open);
    let ok = local.gravar(CACHE_MSG + chave, c);
    if (!ok) {
      liberarEspaco(10);
      ok = local.gravar(CACHE_MSG + chave, c);
    } // espaço cheio: apaga os menos usados e tenta de novo
    if (!ok) return toast('Não consegui guardar uma cópia no aparelho (espaço cheio).', true);
    const uso = local.ler(CACHE_USO) || {};
    uso[chave] = Date.now();
    local.gravar(CACHE_USO, uso);
    if (Object.keys(uso).length > MAX_CACHE) liberarEspaco(0);
  }

  /* ======================= servidor (Apps Script) e login ======================= */
  /* sem internet ou servidor inacessível (implantação antiga, acesso diferente de "Qualquer pessoa") */
  const erroRede = () => Object.assign(new Error(navigator.onLine === false ? 'Sem internet.' : 'Não consegui falar com o servidor. Se a internet está funcionando, confira no Apps Script se a implantação está na versão nova, com acesso "Qualquer pessoa".'), {
    rede: true
  });
  async function chamar(fn, args, cred) {
    if (!CFG.api) throw new Error('Configuração pendente: falta o endereço da API em config.json.');
    let resp;
    try {
      resp = await fetch(CFG.api, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify(Object.assign({
          fn,
          args
        }, cred))
      });
    } catch (e) {
      throw erroRede();
    }
    if (!resp.ok) throw new Error('O servidor respondeu ' + resp.status + '. Tente de novo.');
    try {
      return await resp.json();
    } catch (e) {
      throw new Error('Resposta inesperada do servidor. Confira se a implantação está com acesso "Qualquer pessoa".');
    }
  }
  function lerSessao() {
    const s = local.ler(CHAVE_SESSAO);
    return s && s.exp > Date.now() + 60000 ? s : null;
  }

  /* chama uma função do Code.gs; pede login quando não há sessão ou ela venceu */
  async function run(fn, ...args) {
    if (navigator.onLine === false) throw erroRede();
    const s = lerSessao();
    let sessao = s ? s.sessao : await pedirLogin();
    let r = await chamar(fn, args, {
      sessao
    });
    if (!r.ok && r.auth) {
      local.apagar(CHAVE_SESSAO);
      sessao = await pedirLogin(r.erro);
      r = await chamar(fn, args, {
        sessao
      });
    }
    if (!r.ok) throw Object.assign(new Error(r.erro), r.auth ? {
      auth: true
    } : {});
    return r.data;
  }
  let esperaLogin = null; /* { promessa, ok, falhar } enquanto a tela de entrada está aberta */
  function pedirLogin(motivo) {
    if (!esperaLogin) {
      let ok, falhar;
      const promessa = new Promise((a, b) => {
        ok = a;
        falhar = b;
      });
      esperaLogin = {
        promessa,
        ok,
        falhar
      };
    }
    mostrarLogin(motivo);
    return esperaLogin.promessa;
  }

  /* resposta do "Fazer login com o Google": troca o ID token por uma sessão de 30 dias */
  async function aoEntrar(resp) {
    const caixa = document.getElementById('lmsg');
    if (caixa) {
      caixa.className = '';
      caixa.textContent = 'Entrando…';
    }
    try {
      const r = await chamar('entrar', [], {
        token: resp && resp.credential
      });
      if (!r.ok) throw new Error(r.erro);
      concluirLogin(r.data);
    } catch (e) {
      if (caixa) {
        caixa.className = 'err';
        caixa.textContent = textoErro(e);
      }
    }
  }
  function concluirLogin(dados) {
    local.gravar(CHAVE_SESSAO, dados);
    esconderLogin();
    if (esperaLogin) {
      const e = esperaLogin;
      esperaLogin = null;
      e.ok(dados.sessao);
    } else if (S.view === 'lista') render();
  }

  /* app instalado na Tela de Início (lá o login do Google costuma não completar) */
  const instalado = () => navigator.standalone === true || !!(window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  const vEntrarCodigo = () => "<div class=\"lcod\">\n  <input id=\"lcodigo\" inputmode=\"numeric\" autocomplete=\"one-time-code\" maxlength=\"7\" placeholder=\"000000\" aria-label=\"C\xF3digo de 6 d\xEDgitos\">\n  <button class=\"btn pri\" data-a=\"entrarCodigo\">Entrar</button>\n</div>";

  /* troca o código de 6 dígitos, gerado num aparelho já conectado, por uma sessão */
  async function entrarComCodigo() {
    const inp = document.getElementById('lcodigo'),
      caixa = document.getElementById('lmsg');
    const c = String(inp ? inp.value : '').replace(/\D/g, '');
    const msg = (t, erro) => {
      if (caixa) {
        caixa.className = erro ? 'err' : '';
        caixa.textContent = t;
      }
    };
    if (c.length !== 6) return msg('Digite os 6 números do código.', true);
    msg('Entrando…');
    try {
      const r = await chamar('entrarComCodigo', [], {
        codigo: c
      });
      if (!r.ok) throw new Error(r.erro);
      concluirLogin(r.data);
    } catch (e) {
      msg(textoErro(e), true);
    }
  }
  let gisPronto = false;
  function iniciarGoogle() {
    if (gisPronto) return true;
    if (!(window.google && google.accounts && google.accounts.id)) return false;
    google.accounts.id.initialize({
      client_id: CFG.client,
      callback: aoEntrar,
      auto_select: true,
      cancel_on_tap_outside: false,
      itp_support: true,
      use_fedcm_for_prompt: true
    });
    gisPronto = true;
    return true;
  }
  function mostrarLogin(motivo) {
    const el = document.getElementById('login');
    if (el.classList.contains('on') && document.getElementById('gbtn')) {
      const caixa = document.getElementById('lmsg');
      if (caixa && motivo) caixa.textContent = motivo;
      return;
    }
    el.className = 'on' + (S.view === 'lista' && !S.lista.length ? '' : ' sobre');
    el.innerHTML = "<div class=\"lbox\">\n    <h1 class=\"logo\">Serm\xF5es</h1>\n    <p id=\"lmsg\">" + esc(motivo || 'Entre com a sua conta Google para abrir os seus sermões.') + "</p>\n    " + (instalado() ? '<p>No app instalado, o login do Google pode não funcionar. Abra o app no Safari ou no computador, toque em <b>Conectar outro aparelho</b> no fim da lista e digite aqui o código.</p>' : '') + "\n    <div id=\"gbtn\"></div>\n    <div id=\"lcodbox\">" + (instalado() ? vEntrarCodigo() : '<button class="link" data-a="mostrarCodigo">Entrar com código de outro aparelho</button>') + "</div>\n    <div class=\"off\" id=\"loff\"></div>\n  </div>";
    const tentar = n => {
      if (!document.getElementById('gbtn')) return;
      if (iniciarGoogle()) {
        google.accounts.id.renderButton(document.getElementById('gbtn'), {
          theme: 'filled_black',
          size: 'large',
          shape: 'pill',
          text: 'signin_with',
          locale: 'pt-BR'
        });
        google.accounts.id.prompt();
      } else if (n < 20) setTimeout(() => tentar(n + 1), 300);else {
        const off = document.getElementById('loff');
        if (off) off.innerHTML = '<p>Não foi possível carregar o login do Google. Confira a internet.</p>' + (local.ler(CACHE_LISTA) ? '<button class="btn" data-a="semInternet">Usar o que está salvo no aparelho</button>' : '');
      }
    };
    tentar(0);
  }
  function esconderLogin() {
    const el = document.getElementById('login');
    el.className = '';
    el.innerHTML = '';
  }

  let toastT,

  /* ======================= tempo por parte ======================= */
  /* palavras faladas da parte (notas para mim não contam) */
  function palavras(t) {
    return (t.blocos || []).reduce((n, b) => {
      if (b.tipo === 'obs') return n;
      const s = [b.texto, b.fonte, b.legenda].concat(b.itens || []).filter(Boolean).join(' ').trim();
      return n + (s ? s.split(/\s+/).length : 0);
    }, 0);
  }
  /* minutos de cada parte: o definido pelo usuário, ou a sobra do alvo dividida pelo volume de texto */
  function temposPartes(m) {
    const ts = m.topicos;
    const fixo = ts.reduce((s, t) => s + (t.tempo > 0 ? +t.tempo : 0), 0);
    const peso = t => Math.max(15, palavras(t));
    const pesoLivre = ts.filter(t => !(t.tempo > 0)).reduce((s, t) => s + peso(t), 0);
    const resto = Math.max(0, (m.tempo || 30) - fixo);
    return ts.map(t => t.tempo > 0 ? {
      min: +t.tempo,
      est: false
    } : {
      min: pesoLivre ? resto * peso(t) / pesoLivre : 0,
      est: true
    });
  }
  /* ritmo pessoal (palavras por minuto), aprendido nas pregações registradas neste aparelho */
  const CACHE_RITMO = 'sermoes.ritmo';
  /* só depois de 10 minutos de pregação registrada, para não projetar o sermão inteiro com poucos dados */
  function ritmo() {
    const r = local.ler(CACHE_RITMO);
    return r && r.seg >= 600 ? r.pal / (r.seg / 60) : 0;
  }
  function aprenderRitmo(reg) {
    let pal = 0,
      seg = 0;
    reg.partes.forEach(p => {
      if (p.seg >= 30 && p.palavras >= 20) {
        pal += p.palavras;
        seg += p.seg;
      }
    });
    if (seg < 60) return;
    const r = local.ler(CACHE_RITMO) || {
      pal: 0,
      seg: 0
    };
    local.gravar(CACHE_RITMO, {
      pal: r.pal * 0.6 + pal,
      seg: r.seg * 0.6 + seg
    }); // pregações recentes pesam mais
  }

  /* tamanho do JSON que o servidor grava (mesma forma do salvarMensagem) */

          blocos: t.blocos || []

        return p;
      })
    }).length;
  }

  /* ======================= citações (Ellen White e outras) ======================= */
  /* abreviações do EGW Writings em português mais usadas; outras ficam com o código como veio */
  const LIVROS_EGW = {
    DTN: 'O Desejado de Todas as Nações',
    CC: 'Caminho a Cristo',
    GC: 'O Grande Conflito',
    PP: 'Patriarcas e Profetas',
    PR: 'Profetas e Reis',
    AA: 'Atos dos Apóstolos',
    PJ: 'Parábolas de Jesus',
    CBV: 'A Ciência do Bom Viver',

  };
  const ehEGW = b => /white|egw/i.test(b.fonte || '');
  const aConferir = b => b.tipo === 'citacao' && !!String(b.texto || '').trim() && !b.conferida;
  const nConferir = m => m.topicos.reduce((n, t) => n + t.blocos.filter(aConferir).length, 0);
  const semPagina = b => ehEGW(b) && /\S/.test(String(b.fonte).replace(/ellen g\.? white,?/i, '')) && !/\bp\.?\s*\d|\b[A-Za-z]{1,6}\s+\d+\.\d+/.test(b.fonte);
  function vCitacaoExtras(b) {
    return "<div class=\"citx\">\n    " + (ehEGW(b) || !b.fonte ? "<button class=\"link\" data-a=\"egwConferir\">" + ic('search', 14) + " Conferir no EGW Writings</button>" : '') + "\n    <label class=\"chk\"><input type=\"checkbox\" data-f=\"conferida\" " + (b.conferida ? 'checked' : '') + "> Conferida na fonte (texto literal e p\xE1gina)</label>\n    " + (semPagina(b) ? '<span class="warn">Falta a página na fonte.</span>' : '') + "\n  </div>";
  }

  /* texto copiado do EGW Writings termina (ou é intercalado) com códigos como {DTN 558.2} */
  function lerColagemEGW(txt) {
    const refs = [],
      re = /\{\s*([A-Za-zÀ-ú0-9]{1,8})\s+(\d+)\.(\d+)\s*\}/g;
    let r;
    while (r = re.exec(txt)) refs.push({
      abrev: r[1],
      pag: +r[2],
      par: +r[3]
    });
    if (!refs.length) return null;
    const texto = txt.replace(re, ' ').replace(/[ \t]+\n/g, '\n').replace(/[ \t]{2,}/g, ' ').trim().replace(/^[“"]|[”"]$/g, '').trim();
    const a = refs[0],
      z = refs[refs.length - 1];
    const livro = LIVROS_EGW[a.abrev];
    const pags = a.pag === z.pag || a.abrev !== z.abrev ? 'p. ' + a.pag : 'p. ' + a.pag + '-' + z.pag;
    const codigo = a.abrev + ' ' + a.pag + '.' + a.par + (refs.length > 1 ? '–' + (z.abrev !== a.abrev ? z.abrev + ' ' : '') + z.pag + '.' + z.par : '');
    return {
      texto,
      fonte: 'Ellen G. White, ' + (livro ? livro + ', ' + pags + ' (' + codigo + ')' : codigo),
      codigo
    };
  }
  function vLinhaCap() {

  }

  /* tipos que combinam com o que foi digitado depois da barra */
  function tiposFiltrados(q) {

  function vBloco(b, ti, bi, n) {
    const T = TIPOS[b.tipo] || TIPOS.texto;

    switch (b.tipo) {
      case 'biblico':

an>\n      </div>\n      <div class=\"pgnav\">\n        <button class=\"timer\" id=\"timer\" data-a=\"timer\" title=\"Pausar / continuar\" aria-label=\"Pausar ou continuar o cron\xF4metro\"></button>\n        <span class=\"tparte\" id=\"tparte\"></span>\n        <div class=\"sp\"></div>\n        <button class=\"pv\" data-a=\"pgIr\" data-v=\"" + (i - 1) + "\" " + (i === 0 ? 'disabled' : '') + " aria-label=\"Parte anterior\">" + ic('chevL', 22) + "</button>\n        <button class=\"nx\" data-a=\"pgIr\" data-v=\"" + (i + 1) + "\" " + (prox ? '' : 'disabled') + "><span>" + (prox ? esc(prox.titulo || 'Parte ' + (i + 2)) : 'Última parte') + "</span>" + ic('chevR', 20) + "</button>\n      </div>\n    </footer>\n  </div>";

      return vCaixa(md.novo ? 'Pregação registrada' : 'Pregação', "\n      <div class=\"pres\"><b class=\"" + (r.total > r.alvo * 60 ? 'mais' : '') + "\">" + mmss(r.total) + "</b><span>de " + r.alvo + " min \xB7 " + fmtDataHora(r.data) + (r.culto ? ' · ' + esc(r.culto) : '') + "</span></div>\n      <table class=\"ptab\"><thead><tr><th>Parte</th><th>Previsto</th><th>Real</th></tr></thead><tbody>" + linhas + "</tbody></table>\n      " + outras + "\n      <p class=\"muted\">" + (ritmo() ? 'Seu ritmo nas últimas pregações: ' + Math.round(ritmo()) + ' palavras por minuto. O editor usa isso para mostrar "no seu ritmo".' : 'Com mais pregações registradas, o editor passa a mostrar quanto tempo o sermão leva no seu ritmo.') + "</p>\n      " + (md.novo ? '<div class="pfoot"><button class="link danger" data-a="descartarPregacao">Descartar este registro</button></div>' : ''));

  function novoBloco(ti, tipo, texto) {

    T.blocos.push(b);

    render();
